name: Backend CI/CD Pipeline

# Trigger the workflow on pushes to the main branch
on:
  push:
    branches:
      - main
    # Only run this if we change Python code or tests, ignore Terraform changes
    paths-ignore:
      - 'infrastructure/**'
      - 'README.md'

jobs:
  # PHASE 1: Build and Test (Continuous Integration)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Pytest
        run: pytest

  # PHASE 2: Deploy to Azure (Continuous Deployment)
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    # CRITICAL: These permissions are required for OIDC passwordless login
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Secretless Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 2. Deploy
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'jscloudresumeapp2026'
          scm-do-build-during-deployment: true
          enable-oryx-build: true